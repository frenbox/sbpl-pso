[package]
name = "sbpl-pso"
version = "0.1.0"
edition = "2021"
description = "Smoothly Broken Power Law (SBPL) multi-band light-curve fitter using PSO + L-BFGS"

[lib]
name = "sbpl_pso"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3"]
# Future: CUDA batch PSO kernel (mirrors villar-pso cuda feature)
# cuda = ["cc"]

[dependencies]
argmin = "0.11.0"
argmin-math = { version = "0.5", features = ["vec"] }
rand = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }

[[bin]]
name = "cpu-dispatch-bench"
path = "src/bin/cpu_dispatch_bench.rs"

[profile.release]
lto = "fat"
codegen-units = 1
