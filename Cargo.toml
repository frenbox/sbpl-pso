[package]
name = "sbpl-pso"
version = "0.1.0"
edition = "2021"
description = "Smoothly Broken Power Law (SBPL) multi-band light-curve fitter using PSO + L-BFGS"

[lib]
name = "sbpl_pso"
crate-type = ["cdylib", "rlib"]

[features]
default = []
python = ["pyo3"]
# NVIDIA GPU backend: compiles cuda/sbpl.cu with nvcc and links cudart.
cuda = ["cc"]
# Apple Silicon GPU backend (M1–M5). Pulls in the `metal` crate, which is
# macOS-only — building this feature on Linux/Windows will fail by design.
metal = ["dep:metal"]

[dependencies]
argmin = "0.11.0"
argmin-math = { version = "0.5", features = ["vec"] }
rand = "0.9"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"
pyo3 = { version = "0.24", features = ["extension-module"], optional = true }

# Gate the `metal` crate behind cfg(target_os = "macos") so non-macOS builds
# don't even try to resolve it.
[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.29", optional = true }

[build-dependencies]
cc = { version = "1", features = ["parallel"], optional = true }

[[bin]]
name = "cpu-dispatch-bench"
path = "src/bin/cpu_dispatch_bench.rs"

[[bin]]
name = "gpu-batch-bench"
path = "src/bin/gpu_batch_bench.rs"
required-features = ["cuda"]

[[bin]]
name = "metal-batch-bench"
path = "src/bin/metal_batch_bench.rs"
required-features = ["metal"]

[profile.release]
lto = "fat"
codegen-units = 1
